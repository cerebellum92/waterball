[package]
name = "bbsterm"
version = "0.1.0"
description = "BBSTerm - A cross-platform BBS terminal client"
authors = ["ytchen"]
edition = "2021"

[lib]
name = "bbsterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
portable-pty = "0.8"
log = "0.4"
