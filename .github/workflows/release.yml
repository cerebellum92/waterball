name: Release Build (macOS, Ubuntu, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg / .app
          - platform: 'ubuntu-22.04' # Builds Ubuntu / Debian .deb & .AppImage
          - platform: 'windows-latest' # Builds Windows .msi, .exe & portable .zip

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Set up Strawberry Perl (Windows)
        if: matrix.platform == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Configure apt timeouts, IPv4 and Azure high-speed mirror to prevent archive.ubuntu.com hangs
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -o Acquire::Retries=3 -y || sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        shell: bash
        run: npm ci

      - name: Run Frontend Tests
        shell: bash
        run: node --test

      - name: Build Tauri Application
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            if [ -d "/c/Strawberry/perl/bin" ]; then
              export PATH="/c/Strawberry/perl/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/c/bin:$PATH"
            fi
            which perl
            perl -v | head -n 3
            which nasm || true
          fi
          npx tauri build

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force 2>/dev/null || true
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.3")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag resolved to: $TAG"

      - name: Fix macOS Ad-hoc Codesign & Repackage DMG
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Waterball.app"
          if [ -d "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH with clean Ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            mkdir -p dist_macos_dmg
            cp -R "$APP_PATH" dist_macos_dmg/
            rm -rf src-tauri/target/release/bundle/dmg
            mkdir -p src-tauri/target/release/bundle/dmg
            TAG_OR_VER="${{ steps.get_tag.outputs.tag }}"
            hdiutil create -volname "Waterball" -srcfolder dist_macos_dmg -ov -format UDZO "src-tauri/target/release/bundle/dmg/Waterball_${TAG_OR_VER}_macOS.dmg"
            rm -rf dist_macos_dmg
          fi

      - name: Package Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/waterball.exe portable/Waterball.exe 2>/dev/null || cp src-tauri/target/release/bbsterm.exe portable/Waterball.exe 2>/dev/null || true
          7z a Waterball_windows_x64_portable.zip ./portable/*

      - name: Verify release artifacts
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ runner.os }}" in
            macOS)
              dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
              test "${#dmg[@]}" -gt 0
              ;;
            Linux)
              deb=(src-tauri/target/release/bundle/deb/*.deb)
              appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
              test "${#deb[@]}" -gt 0 && test "${#appimage[@]}" -gt 0
              ;;
            Windows)
              msi=(src-tauri/target/release/bundle/msi/*.msi)
              nsis=(src-tauri/target/release/bundle/nsis/*.exe)
              test "${#msi[@]}" -gt 0 && test "${#nsis[@]}" -gt 0 && test -s Waterball_windows_x64_portable.zip
              ;;
          esac

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Waterball ${{ steps.get_tag.outputs.tag }}
          body: |
            💧 **Waterball (水球) 新世代跨平台 BBS 連線軟體正式發布！**

            ---

            ### ✨ v0.1.7 版本更新：

            #### 📖 文章好讀版全方位進化
            - 新增更多自訂閱讀選項：支援調整字體大小、行距、版面寬度與閱讀主題色彩。
            - 留言區快速跳轉：一鍵滑動至推文區，支援即時搜尋留言內容與特定鄉民 ID。
            - 原 PO 作者推文標記：留言區自動標註「✍️ 原PO」徽章，快速掌握作者回覆。

            #### 💬 水球即時通專頁（Waterball Manager）
            - 獨立水球對話視窗：完整保留即時交談紀錄，不再擔心底行訊息一閃而過。
            - 多人對話進度切換：左側鄉民對話清單、右側即時訊息流，隨時切換不同好友。
            - 即時未讀提示與智慧排版：自動整理 BBS 水球格式，聊天順暢不漏訊。

            #### 🏷️ 鄉民個人標籤與備註（User Tags）
            - 鄉民 ID 自訂標記：可為常互動的板友、作者或交易對象自訂彩色標籤與個人備註。
            - 滑鼠懸停（Hover）提示卡片：在 BBS 終端畫面（如看板文章列表、線上鄉民名單等）將滑鼠移至鄉民帳號上，即自動彈出提示小卡，快速查看專屬標籤與備註。
            - 快捷標記與管理：支援在 BBS 畫面上直接右鍵點擊快速標記帳號，亦可在設定選單中集中管理所有標籤名冊。

            #### 🔔 文章監控與推播中心（Push Notification Center）
            - 智慧條件監控：支援「看板＋關鍵字＋作者＋推數門檻（例如 ≥ 10 推、爆推）」多條件彈性組合。
            - 本地桌面即時通知：支援 macOS、Linux 與 Windows 系統原生桌面通知，點擊通知可直接開啟 PTT 原文。
            - 跨裝置 Telegram 雲端推播：綁定 Telegram Bot，出門在外手機也能即時收到重大情報與熱門文章通知。

            ---

            ### 📦 各作業系統下載與安裝說明：

            #### 🍏 macOS (`.dmg`)
            1. 下載 `Waterball_${{ steps.get_tag.outputs.tag }}_macOS.dmg`，掛載後將 `Waterball.app` 拖移至「應用程式」。
            2. **首次開啟小提示**：本專案為社群開源軟體，未購買 Apple 商業憑證。首次開啟若出現安全性提示：
               - 在 App 上 **按住 `Control` 鍵（或右鍵）點選「打開」**，再點一次「打開」即可。
               - 或前往 Mac **「系統設定 ➔ 隱私權與安全性」** 點選 **「仍要打開」** 即可。

            #### 🐧 Linux (`.deb` / `.AppImage`)
            - **Ubuntu / Debian**：下載 `.deb` 檔案，執行 `sudo dpkg -i <檔案名稱>.deb` 安裝。
            - **其他 Linux**：下載 `.AppImage` 檔案，賦予執行權限後即可免安裝直接點開！

            #### 🪟 Windows (`.zip` 綠色版 / `.msi`)
            - **推薦免安裝版**：下載 `Waterball_windows_x64_portable.zip`，解壓縮後點擊 `Waterball.exe` 即用。
            - **標準安裝版**：下載 `.msi` 進行安裝。

            ---
            詳細功能特色與說明請見 [GitHub 專案首頁](https://github.com/${{ github.repository }})。
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            Waterball_windows_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
