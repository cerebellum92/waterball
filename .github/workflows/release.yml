name: Release Build (macOS, Ubuntu, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg / .app
          - platform: 'ubuntu-22.04' # Builds Ubuntu / Debian .deb & .AppImage
          - platform: 'windows-latest' # Builds Windows .msi, .exe & portable .zip

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Set up Strawberry Perl (Windows)
        if: matrix.platform == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Configure apt timeouts, IPv4 and Azure high-speed mirror to prevent archive.ubuntu.com hangs
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -o Acquire::Retries=3 -y || sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        shell: bash
        run: npm ci

      - name: Run Frontend Tests
        shell: bash
        run: node --test

      - name: Build Tauri Application
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            if [ -d "/c/Strawberry/perl/bin" ]; then
              export PATH="/c/Strawberry/perl/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/c/bin:$PATH"
            fi
            which perl
            perl -v | head -n 3
            which nasm || true
          fi
          npx tauri build

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force 2>/dev/null || true
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.3")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag resolved to: $TAG"

      - name: Fix macOS Ad-hoc Codesign & Repackage DMG
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Waterball.app"
          if [ -d "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH with clean Ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            mkdir -p dist_macos_dmg
            cp -R "$APP_PATH" dist_macos_dmg/
            rm -rf src-tauri/target/release/bundle/dmg
            mkdir -p src-tauri/target/release/bundle/dmg
            TAG_OR_VER="${{ steps.get_tag.outputs.tag }}"
            hdiutil create -volname "Waterball" -srcfolder dist_macos_dmg -ov -format UDZO "src-tauri/target/release/bundle/dmg/Waterball_${TAG_OR_VER}_macOS.dmg"
            rm -rf dist_macos_dmg
          fi

      - name: Package Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/waterball.exe portable/Waterball.exe 2>/dev/null || cp src-tauri/target/release/bbsterm.exe portable/Waterball.exe 2>/dev/null || true
          7z a Waterball_windows_x64_portable.zip ./portable/*

      - name: Verify release artifacts
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ runner.os }}" in
            macOS)
              dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
              test "${#dmg[@]}" -gt 0
              ;;
            Linux)
              deb=(src-tauri/target/release/bundle/deb/*.deb)
              appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
              test "${#deb[@]}" -gt 0 && test "${#appimage[@]}" -gt 0
              ;;
            Windows)
              msi=(src-tauri/target/release/bundle/msi/*.msi)
              nsis=(src-tauri/target/release/bundle/nsis/*.exe)
              test "${#msi[@]}" -gt 0 && test "${#nsis[@]}" -gt 0 && test -s Waterball_windows_x64_portable.zip
              ;;
          esac

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Waterball ${{ steps.get_tag.outputs.tag }}
          body: |
            💧 **Waterball (水球) 新世代跨平台 BBS 連線軟體正式發布！**

            ---

            ### ✨ v0.1.9 版本更新：

            #### 🖼️ 剪貼簿圖片自動上傳與撤回（Image Paste & Revocation）
            - 支援 Imgur（預設）、Catbox.moe 以及自訂圖床 API 端點。
            - 在 BBS 終端機或長推文助手中直接按貼上（Ctrl+V / Cmd+V），自動將剪貼簿圖片上傳並填入網址。純文字剪貼簿內容一律優先。
            - 上傳時自動保留刪除金鑰（deletehash），若傳送過程中按 Esc 停止貼上，或事後於「設定 ➜ 最近上傳紀錄」中，均可隨時手動一鍵自圖床撤回刪除原始檔案。
            - 桌面端一律改走原生 Native IPC，強制 HTTPS 並禁止重新導向；本機儲存配額異常時自動啟用記憶體保全機制。

            #### 💬 智慧長推文自動分段發送助手（PushHelper）
            - 智慧字數安全分段：按下快捷鍵（Cmd+Shift+X / Alt+X）開啟推文小幫手，長篇大論自動精準拆分發送。中文字與全形標點符號防斷裂，不產生半形亂碼。
            - 文章內與看板列表雙模式支援：無論正在閱讀文章或停留在看板文章列表，皆可直接一鍵啟動自動連續推文。
            - 原生推文提示感應防呆：若終端機畫面已處於推文輸入狀態，自動略過多餘按鍵；若 PTT 出現推文類型選單（推/噓/→）才發送選項；若為作者加註或第二段之後推文，PTT 原生跳過選單時亦能完美銜接，絕不誤送 1/2/3 等多餘數字。
            - 發送間隔與進度倒數：提供 0.8 秒至 10 秒多種防洗板發送間隔選擇，具備即時視覺化進度條與倒數提示，每段送出後自動移除已發送文字，並支援隨時手動中止發送。
            - 常用推文範本庫：支援常用推文內容儲存、快速套用與自訂管理。

            #### ⚡ 文章代碼快速跳轉（Article ID Quick Jump）
            - 一鍵跳文（Alt+J / Cmd+J）：支援輸入或直接貼上 #AID、AID 或 PTT 網頁版文章網址，即時解析跳轉。
            - 同看板與跨看板智慧導航：無論位於主選單、文章列表或閱讀內文中，自動切換至目標看板與文章，並提升各畫面狀態下的跳轉相容性與穩定度。

            #### 🛡️ BBS 鄉民與關鍵字黑名單系統（Blacklist Filtering）
            - 雙重過濾維度：支援「使用者帳號（ID）」與「自訂關鍵字」黑名單。
            - 淡化（Dim）與隱藏（Hide）模式：可依偏好選擇將黑名單推文與文章以半透明淡化顯示，或完全隱藏並收合行數。
            - 畫布級隱蔽與安全選取：終端機畫面底層直接遮蔽敏感字元，避免反白複製或滑鼠選取時意外洩漏黑名單內容。
            - 通知與水球警示防護：被封鎖對象發送的推播通知、背景警示與鳴笛聲自動攔截靜音。
            - 規則備份與匯出：支援將黑名單設定安全匯出為 JSON 檔，方便於不同電腦或備份復原。

            #### 📖 文章閱讀器與好讀版體驗升級（Article Reader & URL Repair）
            - 長推文即時載入：好讀版支援完整推文串流解析與平滑捲動，大圖預覽自動展開。
            - 智慧 URL 斷行修復（URL Repair）：自動將 BBS 文章中因 78 欄限制而被強制折行的超長超連結無縫拼接還原，點擊即可開啟正確網址。

            #### 🔔 新文章追蹤與 Telegram 雲端推播優化
            - 多裝置推播規則雙向同步：跨裝置同步推播條件時支援智慧合併，本機暫未啟用的追蹤規則會安全保留，不再被雲端覆蓋清空。

            #### ⌨️ 快捷鍵一覽表（Shortcuts Cheat Sheet）
            - 按下 F1 隨時查閱：新增直覺的鍵盤快捷鍵一覽對話框，自動依當前作業系統（macOS / Windows / Linux）切換顯示對應熱鍵。

            #### 🔧 底層連線穩定性與效能強化
            - 大貼上防凍結保護（Paste Freeze Protection）：大量文字貼上時採分塊交錯發送與行數確認對話框，防止終端 Socket 緩衝區卡死。
            - 連線輸入租約（Input Lease）：貼上交易持有連線獨佔鎖，阻斷發送期間滑鼠滾輪、按鍵連發或巨集的干擾。
            - SSH 寫入死鎖修復：修復 Tauri 桌面端底層 SSH 通道寫入與更新時的潛在死鎖問題。

            ---

            ### 📦 各作業系統下載與安裝說明：

            #### 🍏 macOS (`.dmg`)
            1. 下載 `Waterball_${{ steps.get_tag.outputs.tag }}_macOS.dmg`，掛載後將 `Waterball.app` 拖移至「應用程式」。
            2. **首次開啟小提示**：本專案為社群開源軟體，未購買 Apple 商業憑證。首次開啟若出現安全性提示：
               - 在 App 上 **按住 `Control` 鍵（或右鍵）點選「打開」**，再點一次「打開」即可。
               - 或前往 Mac **「系統設定 ➔ 隱私權與安全性」** 點選 **「仍要打開」** 即可。

            #### 🐧 Linux (`.deb` / `.AppImage`)
            - **Ubuntu / Debian**：下載 `.deb` 檔案，執行 `sudo dpkg -i <檔案名稱>.deb` 安裝。
            - **其他 Linux**：下載 `.AppImage` 檔案，賦予執行權限後即可免安裝直接點開！

            #### 🪟 Windows (`.zip` 綠色版 / `.msi`)
            - **推薦免安裝版**：下載 `Waterball_windows_x64_portable.zip`，解壓縮後點擊 `Waterball.exe` 即用。
            - **標準安裝版**：下載 `.msi` 進行安裝。

            ---
            詳細功能特色與說明請見 [GitHub 專案首頁](https://github.com/${{ github.repository }})。
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            Waterball_windows_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
