name: Release Build (macOS, Ubuntu, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg / .app
          - platform: 'ubuntu-22.04' # Builds Ubuntu / Debian .deb & .AppImage
          - platform: 'windows-latest' # Builds Windows .msi, .exe & portable .zip

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Set up Strawberry Perl (Windows)
        if: matrix.platform == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Configure apt timeouts, IPv4 and Azure high-speed mirror to prevent archive.ubuntu.com hangs
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -o Acquire::Retries=3 -y || sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        shell: bash
        run: npm ci

      - name: Run Frontend Tests
        shell: bash
        run: node --test

      - name: Build Tauri Application
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            if [ -d "/c/Strawberry/perl/bin" ]; then
              export PATH="/c/Strawberry/perl/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/c/bin:$PATH"
            fi
            which perl
            perl -v | head -n 3
            which nasm || true
          fi
          npx tauri build

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force 2>/dev/null || true
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.3")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag resolved to: $TAG"

      - name: Fix macOS Ad-hoc Codesign & Repackage DMG
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Waterball.app"
          if [ -d "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH with clean Ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            mkdir -p dist_macos_dmg
            cp -R "$APP_PATH" dist_macos_dmg/
            rm -rf src-tauri/target/release/bundle/dmg
            mkdir -p src-tauri/target/release/bundle/dmg
            TAG_OR_VER="${{ steps.get_tag.outputs.tag }}"
            hdiutil create -volname "Waterball" -srcfolder dist_macos_dmg -ov -format UDZO "src-tauri/target/release/bundle/dmg/Waterball_${TAG_OR_VER}_macOS.dmg"
            rm -rf dist_macos_dmg
          fi

      - name: Package Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/waterball.exe portable/Waterball.exe 2>/dev/null || cp src-tauri/target/release/bbsterm.exe portable/Waterball.exe 2>/dev/null || true
          7z a Waterball_windows_x64_portable.zip ./portable/*

      - name: Verify release artifacts
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ runner.os }}" in
            macOS)
              dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
              test "${#dmg[@]}" -gt 0
              ;;
            Linux)
              deb=(src-tauri/target/release/bundle/deb/*.deb)
              appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
              test "${#deb[@]}" -gt 0 && test "${#appimage[@]}" -gt 0
              ;;
            Windows)
              msi=(src-tauri/target/release/bundle/msi/*.msi)
              nsis=(src-tauri/target/release/bundle/nsis/*.exe)
              test "${#msi[@]}" -gt 0 && test "${#nsis[@]}" -gt 0 && test -s Waterball_windows_x64_portable.zip
              ;;
          esac

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Waterball ${{ steps.get_tag.outputs.tag }}
          body: |
            💧 **Waterball (水球) v0.1.13 — 新世代跨平台 BBS 連線軟體**

            ---

            ### ✨ v0.1.13 版本更新：

            #### 🔗 修復網址 `8;;` 亂碼並支援新版終端超連結（OSC 8）
            - **修正畫面網址出現 `8;;` 亂碼的問題**：完整支援新版 PTT 使用的 OSC 8 超連結格式，不再把隱藏連結碼印在畫面上；滑鼠點擊或預覽圖片時也會直接開啟完整的真實網址，即使長網址在終端畫面斷行也能正確開啟。

            #### 🆕 提前支援 PTT 新版（PttCurrent）改版並向下相容
            - **相容即將上線的新版推文與留言系統**：因應 PTT 新版多行留言、評分與留言編輯／刪除機制預先完成解析與操作適配，同時完整向下相容現行推文格式，改版前後皆可順暢使用。
            - **相容新版介面與連線細節**：同步支援新版看板／文章列表底部狀態列、長標題省略號比對、UTF-8 雙色字顯示與更穩定的連線防閒置保活機制。

            #### 📺 實況推文（Live Chat）效能與載入架構升級
            - **萬則推文秒開不卡頓**：改採「先載入最新約 200 則即時推文 → 背景同步完整歷史推文並寫入本機資料庫」流程，進入大型盤後閒聊或賽事轉播文時不再需要等待數分鐘翻頁。
            - **按需載入與全歷史篩選**：想翻閱更早之前的推文時可一鍵從本機快取分段讀取，輸入帳號篩選也會直接從完整歷史推文中快速找出所有發言，長時間追實況也能維持低記憶體占用。
            - **修正中文輸入法選字誤送推文**：修正在桌面版與非 Chrome 核心環境下，實況推文輸入中文時按 `Enter` 確認選字會直接送出推文的問題，現在可安心完成選字與檢查錯字後，再按一次 `Enter` 才正式送出。

            #### 🖱️ 全新滑鼠操作與雙排介面配置
            - **右側懸浮滑鼠導覽列（可開關／收合）**：提供「到最頂／往上一頁／退出／往下一頁／到最底」常用按鍵，平時優先停靠在終端機右側黑邊不遮擋畫面，雙分割模式自動隱藏，單手只用滑鼠就能流暢逛板看文。
            - **雙排工具列分層＋自訂常駐按鈕**：善用最上方分頁列右側空間，保留左側習慣的連線操作區，減少小視窗下按鈕只剩圖示看不懂的情況；可在「設定中心 → 顯示與主題」勾選，或直接對任一功能按鈕按**右鍵**，自由決定收合工具列後要保留哪些常用按鈕。
            - **桌面版視窗比例貼合（消除多餘黑邊）**：支援「一鍵貼合（右側導覽列／設定中心）」、「雙擊終端機旁黑邊貼合」，以及可選的「拉動視窗後自動貼合終端機比例」設定，輕鬆對齊零黑邊畫面。

            ---

            ### 📦 各作業系統下載與安裝說明：

            #### 🍏 macOS (Homebrew / `.dmg`)
            - **Homebrew 安裝／升級**：首次安裝 `brew install --cask cerebellum92/waterball/waterball`（若原為 `.dmg` 手動安裝請加 `--force`）；日後升級 `brew upgrade --cask cerebellum92/waterball/waterball`
            - **手動安裝**：下載 `Waterball_${{ steps.get_tag.outputs.tag }}_macOS.dmg`，掛載後將 `Waterball.app` 拖移至「應用程式」。
            - **首次開啟小提示**：本專案為社群開源軟體，未購買 Apple 商業憑證。首次開啟若出現安全性提示：
              - 在 App 上 **按住 `Control` 鍵（或右鍵）點選「打開」**，再點一次「打開」即可。
              - 或前往 Mac **「系統設定 ➔ 隱私權與安全性」** 點選 **「仍要打開」**（或執行 `xattr -cr /Applications/Waterball.app`）即可。

            #### 🐧 Linux (`.deb` / `.AppImage`)
            - **Ubuntu / Debian**：下載 `.deb` 檔案，執行 `sudo dpkg -i <檔案名稱>.deb` 安裝。
            - **其他 Linux**：下載 `.AppImage` 檔案，賦予執行權限後即可免安裝直接點開！

            #### 🪟 Windows (`.zip` 綠色版 / `.msi`)
            - **推薦免安裝版**：下載 `Waterball_windows_x64_portable.zip`，解壓縮後點擊 `Waterball.exe` 即用。
            - **標準安裝版**：下載 `.msi` 進行安裝。

            ---
            詳細功能特色與說明請見 [GitHub 專案首頁](https://github.com/${{ github.repository }})。
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            Waterball_windows_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Cask
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew Tap update."
            exit 0
          fi

          TAG_OR_VER="${{ steps.get_tag.outputs.tag }}"
          VERSION="${TAG_OR_VER#v}"
          TAG_PREFIX=""
          if [[ "$TAG_OR_VER" == v* ]]; then
            TAG_PREFIX="v"
          fi
          DMG_PATH="src-tauri/target/release/bundle/dmg/Waterball_${TAG_OR_VER}_macOS.dmg"
          if [ ! -f "$DMG_PATH" ]; then
            echo "Missing DMG at $DMG_PATH"
            exit 1
          fi

          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          REPO="${{ github.repository }}"
          TAP_REPO="${{ github.repository_owner }}/homebrew-waterball"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" homebrew-tap
          mkdir -p homebrew-tap/Casks

          cat > homebrew-tap/Casks/waterball.rb <<EOF
          cask "waterball" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/${TAG_PREFIX}#{version}/Waterball_${TAG_PREFIX}#{version}_macOS.dmg"
            name "Waterball"
            desc "Cross-platform BBS terminal client with live chat and UAO support"
            homepage "https://github.com/${REPO}"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Waterball.app"

            caveats <<~EOS
              Waterball is ad-hoc signed. If macOS Gatekeeper blocks first launch or upgrade, run:
                xattr -cr /Applications/Waterball.app
              Or open System Settings -> Privacy & Security -> Open Anyway.
            EOS

            zap trash: [
              "~/Library/Application Support/com.waterball.bbs",
              "~/Library/Caches/com.waterball.bbs",
              "~/Library/Preferences/com.waterball.bbs.plist",
            ]
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain Casks/waterball.rb)" ]; then
            git add Casks/waterball.rb
            git commit -m "chore(cask): update waterball to ${TAG_OR_VER}"
            git push origin HEAD || git push -u origin HEAD:main
          else
            echo "Casks/waterball.rb is already up to date."
          fi
