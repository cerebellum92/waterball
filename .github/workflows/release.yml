name: Release Build (macOS, Ubuntu, Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg / .app
          - platform: 'ubuntu-22.04' # Builds Ubuntu / Debian .deb & .AppImage
          - platform: 'windows-latest' # Builds Windows .msi, .exe & portable .zip

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        run: npx tauri build

      - name: Fix macOS Ad-hoc Codesign & Repackage DMG
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Waterball.app"
          if [ -d "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH with clean Ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            mkdir -p dist_macos_dmg
            cp -R "$APP_PATH" dist_macos_dmg/
            rm -rf src-tauri/target/release/bundle/dmg
            mkdir -p src-tauri/target/release/bundle/dmg
            hdiutil create -volname "Waterball" -srcfolder dist_macos_dmg -ov -format UDZO src-tauri/target/release/bundle/dmg/Waterball_0.1.0_macOS.dmg
            rm -rf dist_macos_dmg
          fi

      - name: Package Windows Portable Zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/waterball.exe portable/Waterball.exe 2>/dev/null || cp src-tauri/target/release/bbsterm.exe portable/Waterball.exe 2>/dev/null || true
          7z a Waterball_windows_x64_portable.zip ./portable/*

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Waterball ${{ github.ref_name }}
          body: '💧 Waterball (水球) 新世代跨平台 BBS 連線軟體正式發布！'
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            Waterball_windows_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
