name = "waterball-ptt-tracker"
main = "worker.js"
compatibility_date = "2024-01-01"

# 1. 綁定免費 KV Namespace
# 部署前請在 Cloudflare 建立 KV：npx wrangler kv:namespace create PTT_TRACKER_KV
# 並將產生的 id 填入下方：
[[kv_namespaces]]
binding = "PTT_TRACKER_KV"
id = "your-kv-namespace-id-here"

# 2. 定時觸發排程（每 3 分鐘自動檢查一次 PTT 最新文章）
[triggers]
crons = ["*/3 * * * *"]
